name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Web Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.zynqosocial.app","appName":"Zynqo Social","webDir":"dist","server":{"androidScheme":"https"}}' > android/app/src/main/assets/capacitor.config.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" zynqo-social.apk
          ls -lh zynqo-social.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zynqo-Social-Android-App-APK
          path: zynqo-social.apk
          retention-days: 30

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-android
          name: "Zynqo Social v1.0.0 (Android APK)"
          body: "Official Android APK build for Zynqo Social. Download `zynqo-social.apk` below and install directly on any Android phone or tablet."
          files: zynqo-social.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
